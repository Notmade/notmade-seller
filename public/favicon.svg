<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { fill: #CC0000; }
        50% { fill: #9E0000; }
      }
      @keyframes textPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.88; }
      }
      .bg { animation: pulse 2.5s ease-in-out infinite; }
      .nm { animation: textPulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="bg" width="64" height="64" rx="10" fill="#CC0000"/>
  <text
    class="nm"
    x="32" y="44"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="27"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >NM</text>
</svg>
